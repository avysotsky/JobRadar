name: Docker deployment integration
on:
  push:
    branches:
      - jobradar/phase6-multi-feed-deployment
      - jobradar/phase7-vacancy-triage
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/docker-deployment-test.yml'
      - 'src/JobRadar/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/docker-deployment-test.yml'
      - 'src/JobRadar/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JOBRADAR_POSTGRES_PASSWORD: ci-disposable-not-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose graph
        run: docker compose config --quiet
      - name: Build production collector image
        run: docker compose build collector
      - name: Start persistent database
        run: docker compose up -d --wait database
      - name: Confirm database status via production image
        run: docker compose run --rm collector --pending-status
      - name: Export empty database as JSONL
        run: docker compose run --rm collector --export-jsonl
      - name: Export triage shortlist and audit
        run: docker compose run --rm collector --triage-jsonl
      - name: Tear down ephemeral CI resources
        if: always()
        run: docker compose down -v --remove-orphans
