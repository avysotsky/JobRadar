name: Supplemental RSS feed diagnostics
on:
  push:
    branches:
      - jobradar/phase6-multi-feed-deployment
    paths:
      - 'src/JobRadar/**'
      - '.github/workflows/feed-variant-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project src/JobRadar/JobRadar.csproj -- --smoke-feed-variants
