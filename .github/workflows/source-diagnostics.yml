name: Public-source diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - jobradar/phase3-djinni-rss-jooble-guarded
    paths:
      - 'src/JobRadar/Sources.cs'
      - 'src/JobRadar/Program.cs'
      - '.github/workflows/source-diagnostics.yml'
permissions:
  contents: read
jobs:
  dou-workua:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [djinni, dou]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project src/JobRadar/JobRadar.csproj -- --smoke-${{ matrix.site }}
