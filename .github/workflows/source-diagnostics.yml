name: Public-source diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - jobradar/phase4-pending-retry-audit
    paths:
      - 'src/JobRadar/Sources.cs'
      - 'src/JobRadar/Program.cs'
      - '.github/workflows/source-diagnostics.yml'
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  public-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [djinni, dou]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project src/JobRadar/JobRadar.csproj -- --smoke-${{ matrix.site }}
