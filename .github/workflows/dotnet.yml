name: .NET CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/JobRadar.Tests/JobRadar.Tests.csproj
      - run: dotnet build tests/JobRadar.Tests/JobRadar.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/JobRadar.Tests/JobRadar.Tests.csproj --no-build --configuration Release
