name: .NET CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBRADAR_TEST_DB: Host=localhost;Port=5432;Database=jobradar;Username=jobradar;Password=jobradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/JobRadar.Tests/JobRadar.Tests.csproj
      - run: dotnet build tests/JobRadar.Tests/JobRadar.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/JobRadar.Tests/JobRadar.Tests.csproj --no-build --configuration Release
